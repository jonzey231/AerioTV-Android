<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AerioTV</title>
<!--
  AerioTV custom Cast Web Receiver (GH #33).

  Deliberately does NOT use <cast-media-player>: the CAF SDK drives the bare
  <video class="castMediaElement"> below instead, so the stock receiver's
  bottom-third timeline/metadata overlay (which never auto-hides on a live
  progressive fMP4 whose duration keeps growing) simply does not exist.
  Documented pattern: developers.google.com/cast/docs/web_receiver/customize_ui
  ("Custom UI data binding" / castMediaElement).

  UI owned by this page:
   - idle/launch screen: AerioTV wordmark on a dark gradient
   - a channel banner that shows for 4s after each load, then fades out
-->
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: "Roboto", "Helvetica Neue", Arial, sans-serif;
  }
  video.castMediaElement {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
  }
  /* Idle / launch screen (visible until the first load; back after playback ends) */
  #idle {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(120% 120% at 50% 20%, #0e2230 0%, #060d13 55%, #03070b 100%);
    transition: opacity .6s ease;
  }
  #idle.hidden { opacity: 0; pointer-events: none; }
  #idle .wordmark {
    color: #ffffff; font-size: 64px; font-weight: 700; letter-spacing: 1px;
  }
  #idle .wordmark span { color: #22c3e6; }
  #idle .tagline {
    margin-top: 14px; color: rgba(255,255,255,.55); font-size: 24px; font-weight: 400;
  }
  /* Channel banner: shows ~4s on tune, then fades. This page owns the timer,
     so nothing re-wakes it. */
  #banner {
    position: absolute; left: 56px; bottom: 56px;
    max-width: 62%;
    padding: 18px 30px; border-radius: 14px;
    background: rgba(6, 13, 19, .72);
    border: 1px solid rgba(34, 195, 230, .25);
    color: #fff;
    opacity: 0; transition: opacity .5s ease;
    pointer-events: none;
  }
  #banner.visible { opacity: 1; }
  #banner .title { font-size: 38px; font-weight: 600; line-height: 1.2; }
  #banner .subtitle {
    margin-top: 4px; color: rgba(255,255,255,.65);
    font-size: 26px; font-weight: 400; line-height: 1.25;
  }
  #banner .subtitle:empty { display: none; }
  /* Loading indicator, under the wordmark on the idle art. Visible from LOAD
     until the picture is actually rendering, and again if playback sits in
     BUFFERING. Matches the Apple TV app's wording. */
  #loading {
    margin-top: 40px;
    display: flex; flex-direction: column; align-items: center;
    transition: opacity .3s ease;
  }
  #loading.hidden { opacity: 0; }
  #loading .spinner {
    width: 52px; height: 52px;
    border: 4px solid rgba(255,255,255,.18);
    border-top-color: #22c3e6;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading .status {
    margin-top: 20px; min-height: 28px;
    color: rgba(255,255,255,.7); font-size: 24px; font-weight: 400;
    /* The status strings carry their own spacing, so keep it. */
    white-space: pre;
    opacity: 0; transition: opacity .3s ease;
  }
  #loading .status.visible { opacity: 1; }
</style>
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <video class="castMediaElement" playsinline autoplay></video>

  <div id="idle">
    <div class="wordmark">Aerio<span>TV</span></div>
    <div class="tagline">Ready to cast</div>
    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <div class="status" id="loadingStatus"></div>
    </div>
  </div>

  <div id="banner">
    <div class="title" id="bannerTitle"></div>
    <div class="subtitle" id="bannerSubtitle"></div>
  </div>

  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    const idle = document.getElementById('idle');
    const banner = document.getElementById('banner');
    const bannerTitle = document.getElementById('bannerTitle');
    const bannerSubtitle = document.getElementById('bannerSubtitle');
    const loading = document.getElementById('loading');
    const loadingStatus = document.getElementById('loadingStatus');
    let bannerTimer = null;

    function flashBanner(title, subtitle) {
      if (!title) return;
      bannerTitle.textContent = title;
      bannerSubtitle.textContent = subtitle || '';
      banner.classList.add('visible');
      clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => banner.classList.remove('visible'), 4000);
    }

    // ---- loading indicator ----
    //
    // A cast tune is not instant: the phone's proxy has to open the provider
    // stream, remux it and publish a window before the receiver has anything
    // to decode. Until 2026-09-12 this page showed the bare "Ready to cast"
    // art for all of it, which reads as a dead receiver. The spinner appears
    // on LOAD, the status line joins it after STATUS_DELAY_MS (a fast tune
    // never shows any text at all), and both go away the moment the picture
    // is rendering. Wording follows the Apple TV app so one vocabulary
    // describes a tune on every platform.
    const STATUS_DELAY_MS = 3000;
    const LOADING_TICK_MS = 250;
    // How long playback has to sit in BUFFERING before the indicator comes
    // back over the picture. Short stalls are not worth a spinner.
    const BUFFERING_REVEAL_MS = 3000;

    // Phase bookkeeping for the text. manifestSeenAt is set by the manifest
    // handler (the first manifest fetch that came back), bytesAppended by the
    // segment handler; see playbackConfig below.
    let loadingSince = 0;
    let manifestSeenAt = 0;
    let bytesAppended = 0;
    let renderingSince = 0;
    let bufferingSince = 0;
    let loadingVisible = false;
    let lastRenderTime = null;

    function showLoading() {
      if (loadingVisible) return;
      loadingVisible = true;
      idle.classList.remove('hidden');
      loading.classList.remove('hidden');
      loadingStatus.classList.remove('visible');
      loadingStatus.textContent = '';
    }

    function hideLoading() {
      if (!loadingVisible) return;
      loadingVisible = false;
      loading.classList.add('hidden');
      loadingStatus.classList.remove('visible');
      idle.classList.add('hidden');
    }

    // Bytes the segment handler has seen, falling back to Shaka's own counter
    // when this CAF build never calls our handler.
    function downloadedBytes() {
      if (bytesAppended > 0) return bytesAppended;
      try {
        const player = playerManager.getPlayer && playerManager.getPlayer();
        const stats = player && player.getStats ? player.getStats() : null;
        if (stats && typeof stats.bytesDownloaded === 'number') {
          return stats.bytesDownloaded;
        }
      } catch (e) {
        // Best effort only; the spinner does not depend on it.
      }
      return 0;
    }

    function secondsSince(ms, nowMs) {
      return Math.max(0, Math.round((nowMs - ms) / 1000));
    }

    function loadingText(nowMs) {
      if (bufferingSince && renderingSince) {
        return 'Buffering  ' + secondsSince(bufferingSince, nowMs) + ' s';
      }
      if (!manifestSeenAt) return 'Connecting to server';
      const bytes = downloadedBytes();
      if (bytes <= 0) {
        return 'Waiting for stream data  ' + secondsSince(loadingSince, nowMs) + ' s';
      }
      return 'Received ' + (bytes / 1048576).toFixed(1) + ' MB';
    }

    setInterval(() => {
      const video = mediaElement();
      const nowMs = Date.now();
      let state = null;
      try {
        state = playerManager.getPlayerState();
      } catch (e) {
        state = null;
      }
      const S = cast.framework.messages.PlayerState;
      if (state === S.IDLE) {
        // Nothing loaded: the plain idle art owns the screen.
        bufferingSince = 0;
        renderingSince = 0;
        loadingSince = 0;
        hideLoading();
        idle.classList.remove('hidden');
        return;
      }

      // Rendering means the playhead is moving with decoded media behind it,
      // which is the only signal that says a frame actually reached the
      // screen; PLAYER_LOAD_COMPLETE fires well before that on a live tune.
      const t = video ? video.currentTime : null;
      const advancing = video && lastRenderTime !== null && t > lastRenderTime;
      lastRenderTime = t;
      const rendering = !!video && state === S.PLAYING && advancing &&
        video.readyState >= 2 && !video.paused;
      if (rendering) {
        if (!renderingSince) renderingSince = nowMs;
        bufferingSince = 0;
        hideLoading();
        return;
      }

      if (state === S.BUFFERING || state === S.LOADING) {
        if (!bufferingSince) bufferingSince = nowMs;
      } else {
        bufferingSince = 0;
      }

      // Before the first frame the indicator is up from LOAD. After it, only
      // a stall longer than BUFFERING_REVEAL_MS brings it back.
      if (!renderingSince) {
        if (!loadingSince) loadingSince = nowMs;
        showLoading();
      } else if (bufferingSince && nowMs - bufferingSince >= BUFFERING_REVEAL_MS) {
        showLoading();
      } else {
        return;
      }

      const since = renderingSince ? bufferingSince : loadingSince;
      if (nowMs - since >= STATUS_DELAY_MS) {
        loadingStatus.textContent = loadingText(nowMs);
        loadingStatus.classList.add('visible');
      }
    }, LOADING_TICK_MS);

    // How far behind the live edge a live load starts, in seconds.
    //
    // This was 9 (three of the proxy's 3 s targets). On the 2026-09-12 15:10
    // session that put the start position at the very beginning of the
    // published window and the load never recovered: the proxy's ready gate
    // hands the receiver 9 s of media, the first playlist was
    // 3.804 + 3.603 + 3.904 = 11.311 s long, and Shaka seeked the element to
    // 11.311 - 9 = 2.439 s BEFORE a single media segment had been appended
    // (receiver log: seek(2.439) at 15:10:03.851 and again at .086, the
    // first appendBuffer of seg0 at .106). One frame was decoded
    // (kVideoSizeChanged 1920x1080 at 15:10:04.747) and then the playhead
    // was relocated to the media's own start, seek(0.016) at 15:10:04.187
    // with External.Cast.Shaka.MediaGapJumped=1, after which the media
    // status sat at position -58 ms, state BUFFERING, speed 0.0 for 45 s
    // and no further segment was ever fetched.
    //
    // The real mechanism is in resyncPlayhead below: Shaka's start-position
    // seek is issued before the first media append and the element discards
    // it, so no value of this constant alone would have fixed the 15:10
    // freeze. What it still does is bound how far Shaka's presentation
    // position can sit from the head of the buffer before resyncPlayhead
    // closes the gap, and it is the target that function seeks to. The cuts
    // land on keyframes, not on the 3 s target, so three targets back
    // against three keyframe-length segments aims at the first instants of
    // the window; four seconds against a 9 to 12 s window aims 5 to 8 s in,
    // with media both behind the playhead and ahead of it. The matching
    // proxy-side number is the ready gate (9 s of media before the load is
    // sent) and the two have to move together.
    const LIVE_START_BEHIND_SECONDS = 10;

    // EXT-X-TARGETDURATION the proxy publishes is the longest segment in the
    // window (our cuts land on keyframes, measured 3 to 6 s). Used as the
    // guard band around the live seek range end: a playhead within one
    // target duration of the end is at the edge by design, not stuck.
    const TARGET_DURATION_SECONDS = 6;

    // The watchdog below may not act more than once per this interval. On the
    // 2026-09-12 17:13 session it fired every ~4 s for 97 s straight (each
    // nudge landed outside the buffer, so the next tick was stuck again), and
    // every one of those seeks flushed the decoder: the Streamer logged 118
    // "Discard frames from previous generation" and 95 "flushed work; ignored"
    // in three minutes, which is the slideshow Logan saw. A rescue that has
    // not worked within 10 s is not going to work on the 4 s retry either.
    const WATCHDOG_MIN_INTERVAL_MS = 10000;

    // How far inside the buffered range a resync target must sit. The seek is
    // only useful if the element has decodable media AT the target, so we aim
    // a second short of the buffered end (the next append has usually not
    // landed there yet) and half a second past its start (an append can trim
    // the front out from under us between the clamp and the seek).
    const RESYNC_END_MARGIN_SECONDS = 1.0;
    const RESYNC_START_MARGIN_SECONDS = 0.5;

    // manifest.availabilityWindowOverride, below. Shaka derives a live HLS
    // stream's segmentAvailabilityDuration from the playlist window itself
    // (hls_parser.js determineDuration_ -> getLiveDuration_, which is
    // maxTimestamp - minTimestamp of the CURRENT segment index), and it then
    // evicts that same index at getSegmentAvailabilityStart() =
    // availabilityEnd - segmentAvailabilityDuration. The two feed each
    // other: every eviction raises minTimestamp, which shrinks the duration,
    // which raises the eviction point, and the window ratchets down to a
    // single segment. Measured on the Google TV Streamer at 16:30:52 with
    // our 5 s segments and a 4 s presentation delay:
    // seek=[51.368-52.373], exactly 5.005 - 4 seconds wide, one segment of
    // availability minus the delay, sitting on the buffered end. Pinning the
    // duration to a constant (hls_parser.js:1383, "The app can override that
    // with a longer duration, to allow seeking") breaks the loop: the seek
    // range becomes [availEnd - 20, availEnd - 4], 16 s wide. Deliberately
    // under the proxy's published window (5 segments, 15 to 25 s) plus its
    // ring, so we never claim availability for media the proxy has dropped.
    const AVAILABILITY_WINDOW_SECONDS = 20;

    // ---- receiver telemetry (urn:x-cast:com.aeriotv.receiver.debug) ----
    //
    // Nothing this page prints is readable from the devices we debug with:
    // the 2026-09-12 15:10 capture of the Streamer's whole logcat contains
    // zero CONSOLE lines from this page, so the receiver's own view of
    // currentTime, the buffered ranges and the seek range was invisible and
    // every diagnosis of a stalled playhead had to be inferred from
    // Chromium's media log. This channel makes that state explicit in the
    // sender's log instead, which is the log we always have.
    //
    // One-way, receiver to sender, diagnostic only: nothing on this page
    // reads a reply, and both senders do nothing but print what arrives.
    const DEBUG_NAMESPACE = 'urn:x-cast:com.aeriotv.receiver.debug';

    // Last error or warning Shaka / CAF surfaced, reported with every
    // snapshot so a stall can be read together with whatever preceded it.
    let lastReceiverError = null;

    // ---- pause / seek / load bookkeeping ----
    //
    // The 2026-09-12 17:13 session ran for 97 s with the CAF player state
    // PAUSED and playbackRate 1 while this page kept seeking, so a resync can
    // never assume playback will resume on its own. These three flags let the
    // rescue path tell the two cases apart: somebody asked for a pause (leave
    // it alone) versus the element is paused with nobody having asked (resume
    // it, and say so in the telemetry).
    let userPaused = false;
    // Set on SEEKING, cleared on SEEKED: the watchdog must never stack a
    // second seek on an outstanding one.
    let seekPending = false;
    // Monotonic timestamps / counters, not wall clock semantics: only
    // differences are used.
    let lastWatchdogAt = 0;
    // Bumped by every LOAD. A deferred teardown captures the value it was
    // queued at and does nothing if a new load has begun since; see
    // unloadMediaElement's callers.
    let loadGeneration = 0;

    // ---- measured MSE codec support (replaces the senders' model guess) ----
    //
    // 2026-09-12 (gtvlogs/session16, 15:52:40): with the plain AC-3 stream
    // this page's Chromium logged
    //   isTypeSupported('video/mp4; codecs="avc1.64002A,ac-3"') -> false
    // on a Google TV Streamer, and the load died with Shaka 3015 on both
    // senders. The senders' model allow-list said that device decodes AC-3:
    // true of the platform's own players, false of the web receiver's MSE,
    // which is the only decoder that matters here. So the receiver MEASURES
    // its own MSE support and tells the senders, and the senders decide the
    // audio ingest from the measurement instead of the device name.
    const CAPS_TYPES = {
      'ac-3': 'video/mp4; codecs="ac-3"',
      'ec-3': 'video/mp4; codecs="ec-3"',
      'mp4a.40.2': 'video/mp4; codecs="mp4a.40.2"',
      'avc1.64002A': 'video/mp4; codecs="avc1.64002A"',
    };

    function mseCapabilities() {
      const out = {};
      for (const key in CAPS_TYPES) {
        let ok = false;
        try {
          ok = typeof MediaSource !== 'undefined' &&
            !!MediaSource.isTypeSupported(CAPS_TYPES[key]);
        } catch (e) {
          ok = false;
        }
        out[key] = ok;
      }
      return out;
    }

    // Sent on READY (before any load, so the first load can use it) and
    // repeated with every telemetry snapshot, because a sender that
    // attached its channel after READY would otherwise never see it.
    function sendCapabilities(reason) {
      try {
        context.sendCustomMessage(DEBUG_NAMESPACE, undefined, {
          type: 'caps',
          ev: reason,
          mse: mseCapabilities(),
        });
      } catch (e) {
        // Diagnostics must never be able to break playback.
      }
    }

    function roundTo(value, places) {
      if (typeof value !== 'number' || !isFinite(value)) return null;
      const f = Math.pow(10, places);
      return Math.round(value * f) / f;
    }

    function mediaElement() {
      return document.querySelector('video.castMediaElement');
    }

    // Every buffered range of the media element. For our single muxed
    // SourceBuffer Chromium reports the INTERSECTION of the video and audio
    // tracks, so this is exactly the interval the playhead has to sit inside
    // for the picture to advance.
    function bufferedRanges() {
      const video = mediaElement();
      const out = [];
      if (!video) return out;
      let ranges;
      try {
        ranges = video.buffered;
      } catch (e) {
        return out;
      }
      if (!ranges) return out;
      for (let i = 0; i < ranges.length; i++) {
        out.push([roundTo(ranges.start(i), 3), roundTo(ranges.end(i), 3)]);
      }
      return out;
    }

    // ---- decoded / dropped frame accounting ----
    //
    // 2026-09-12: Logan reports the cast picture "looks like the frame rate
    // isn't correct, or dropping frames" on 720p60 and 1080i channels while
    // the telemetry reports a steady PLAYING with a playhead that advances.
    // A state machine cannot see that: a receiver that decodes 60 fps and
    // presents 30, or drops every other frame, reports exactly the same
    // state. So every snapshot now carries the element's own frame counters
    // plus per-second deltas, which is the only number that distinguishes
    // "presenting fewer frames than the stream carries" from "not playing".
    let lastQualityAt = 0;
    let lastTotalFrames = null;
    let lastDroppedFrames = null;

    // Estimated display refresh, measured once per load over 1 s of
    // requestAnimationFrame callbacks. A 60 fps stream on a 30 Hz output
    // cannot look right no matter how healthy the pipeline is, and the
    // receiver is the only place that can see the output's cadence.
    let rafHz = null;

    function measureRefreshRate() {
      if (typeof requestAnimationFrame !== 'function') return;
      let frames = 0;
      let start = null;
      const step = (ts) => {
        if (start === null) {
          start = ts;
        } else {
          frames++;
          if (ts - start >= 1000) {
            rafHz = roundTo(frames * 1000 / (ts - start), 1);
            sendReceiverSnapshot('raf');
            return;
          }
        }
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    // video.getVideoPlaybackQuality() plus deltas over the interval since the
    // previous snapshot. Deltas are computed here rather than on the sender so
    // a single log line is self-contained: fps is DECODED frames per second
    // (totalVideoFrames delta / elapsed), drop is dropped frames per second.
    function videoQuality(video) {
      const out = {
        tvf: null, dvf: null, cvf: null, fps: null, drop: null,
        res: null,
      };
      if (!video) return out;
      if (video.videoWidth || video.videoHeight) {
        out.res = (video.videoWidth || 0) + 'x' + (video.videoHeight || 0);
      }
      let q = null;
      try {
        if (typeof video.getVideoPlaybackQuality === 'function') {
          q = video.getVideoPlaybackQuality();
        }
      } catch (e) {
        q = null;
      }
      if (!q) {
        // Pre-spec builds expose the webkit counters only.
        if (typeof video.webkitDecodedFrameCount === 'number') {
          q = {
            totalVideoFrames: video.webkitDecodedFrameCount,
            droppedVideoFrames: video.webkitDroppedFrameCount,
            corruptedVideoFrames: null,
          };
        } else {
          return out;
        }
      }
      const total = typeof q.totalVideoFrames === 'number' ? q.totalVideoFrames : null;
      const dropped = typeof q.droppedVideoFrames === 'number' ? q.droppedVideoFrames : null;
      out.tvf = total;
      out.dvf = dropped;
      out.cvf = typeof q.corruptedVideoFrames === 'number' ? q.corruptedVideoFrames : null;
      const now = Date.now();
      const elapsed = lastQualityAt ? (now - lastQualityAt) / 1000 : 0;
      if (elapsed >= 0.2 && elapsed <= 10) {
        if (total !== null && lastTotalFrames !== null) {
          out.fps = roundTo((total - lastTotalFrames) / elapsed, 1);
        }
        if (dropped !== null && lastDroppedFrames !== null) {
          out.drop = roundTo((dropped - lastDroppedFrames) / elapsed, 1);
        }
      }
      lastQualityAt = now;
      lastTotalFrames = total;
      lastDroppedFrames = dropped;
      return out;
    }

    // Shaka's own counters. CAF bundles Shaka but does not document a getter
    // for the instance, so this is best effort: whatever is reachable is
    // reported and the rest comes through as absent rather than as a guess.
    function shakaStats() {
      let stats = null;
      try {
        const player = playerManager.getPlayer && playerManager.getPlayer();
        if (player && player.getStats) stats = player.getStats();
      } catch (e) {
        stats = null;
      }
      if (!stats) {
        try {
          if (playerManager.getStats) stats = playerManager.getStats();
        } catch (e) {
          stats = null;
        }
      }
      if (!stats) return {};
      let hist = null;
      const history = stats.stateHistory;
      if (Array.isArray(history) && history.length) {
        const last = history[history.length - 1];
        if (last) {
          hist = String(last.state) + '@' + roundTo(last.timestamp, 1) +
            '+' + roundTo(last.duration, 1) + 's';
        }
      }
      const num = (v) => (typeof v === 'number' && isFinite(v) ? v : null);
      return {
        bufTime: roundTo(stats.bufferingTime, 2),
        bw: typeof stats.estimatedBandwidth === 'number' ?
          Math.round(stats.estimatedBandwidth) : null,
        hist: hist,
        // Shaka's view of the same frames the element reports. When the two
        // disagree the loss is downstream of Shaka (renderer / output), and
        // when they agree it is the stream or the decoder.
        sdec: num(stats.decodedFrames),
        sdrop: num(stats.droppedFrames),
        stalls: num(stats.stallsDetected),
        gaps: num(stats.gapsJumped),
      };
    }

    // Frame rate of the variant Shaka is actually playing, when the bundled
    // version exposes the track list. Compared against fps= this says whether
    // the receiver is presenting every frame the stream declares.
    function variantFrameRate() {
      try {
        const player = playerManager.getPlayer && playerManager.getPlayer();
        const tracks = player && player.getVariantTracks ?
          player.getVariantTracks() : null;
        if (!Array.isArray(tracks)) return null;
        for (const t of tracks) {
          if (t && t.active && typeof t.frameRate === 'number') {
            return roundTo(t.frameRate, 3);
          }
        }
      } catch (e) {
        return null;
      }
      return null;
    }

    // The live window Shaka believes it has. A playhead outside this range
    // is the state that stops StreamingEngine asking for segments at all,
    // which is what the dead proxy log looks like from the sender side.
    function seekRange() {
      try {
        const range = playerManager.getLiveSeekableRange();
        if (!range) return null;
        return [roundTo(range.start, 3), roundTo(range.end, 3)];
      } catch (e) {
        return null;
      }
    }

    function sendReceiverSnapshot(ev) {
      const video = mediaElement();
      const stats = shakaStats();
      const vq = videoQuality(video);
      const payload = {
        type: 'state',
        ev: ev,
        // Repeated here so the senders learn the measurement even if they
        // attached the debug channel after the READY message went out.
        mse: mseCapabilities(),
        t: video ? roundTo(video.currentTime, 3) : null,
        buffered: bufferedRanges(),
        ready: video ? video.readyState : null,
        state: null,
        // Reported SEPARATELY from state on purpose. The 17:13 session showed
        // "state=PAUSED rate=1" and there was no way to tell whether the media
        // element itself was paused or whether only CAF's state machine
        // thought so, which are different bugs with different fixes.
        elPaused: video ? !!video.paused : null,
        cafState: null,
        userPaused: userPaused,
        seekPending: seekPending,
        rate: video ? roundTo(video.playbackRate, 2) : null,
        seek: seekRange(),
        bufTime: stats.bufTime === undefined ? null : stats.bufTime,
        bw: stats.bw === undefined ? null : stats.bw,
        hist: stats.hist === undefined ? null : stats.hist,
        // Frame accounting (see videoQuality): element counters, their
        // per-second deltas, the decoded size, and Shaka's own counters.
        tvf: vq.tvf,
        dvf: vq.dvf,
        cvf: vq.cvf,
        fps: vq.fps,
        drop: vq.drop,
        res: vq.res,
        vfr: variantFrameRate(),
        sdec: stats.sdec === undefined ? null : stats.sdec,
        sdrop: stats.sdrop === undefined ? null : stats.sdrop,
        stalls: stats.stalls === undefined ? null : stats.stalls,
        gaps: stats.gaps === undefined ? null : stats.gaps,
        rafHz: rafHz,
        err: lastReceiverError,
      };
      try {
        payload.state = playerManager.getPlayerState();
        payload.cafState = payload.state;
      } catch (e) {
        payload.state = null;
        payload.cafState = null;
      }
      // Hard 1.5 KB budget. The frame counters added room for growth, and a
      // live stream with many buffered ranges or a long Shaka error string is
      // the case that would blow it: trim the parts that are summaries
      // (ranges between the first and the last, the error text) rather than
      // drop a numeric field.
      try {
        let json = JSON.stringify(payload);
        if (json.length > 1500 && typeof payload.err === 'string' &&
            payload.err.length > 120) {
          payload.err = payload.err.slice(0, 120);
          json = JSON.stringify(payload);
        }
        while (json.length > 1500 && payload.buffered.length > 2) {
          payload.buffered.splice(1, payload.buffered.length - 2);
          json = JSON.stringify(payload);
        }
      } catch (e) {
        // Never let the budget check stop the snapshot.
      }
      try {
        // Broadcast: no sender id, so whichever phone is connected gets it.
        context.sendCustomMessage(DEBUG_NAMESPACE, undefined, payload);
      } catch (e) {
        // Diagnostics must never be able to break playback.
      }
    }

    // Once per second while the playhead is not making progress, which is
    // the only interval where the numbers matter and keeps a healthy stream
    // from flooding the sender log. A run of identical currentTime values
    // while the state is PLAYING is the frozen-picture case and is reported
    // with ev=stuck.
    let lastTickTime = null;
    let stuckTicks = 0;
    setInterval(() => {
      const video = mediaElement();
      if (!video) return;
      let state = null;
      try {
        state = playerManager.getPlayerState();
      } catch (e) {
        state = null;
      }
      const S = cast.framework.messages.PlayerState;
      const loadingOrBuffering = state === S.BUFFERING || state === S.LOADING;
      const now = roundTo(video.currentTime, 3);
      const advanced = lastTickTime === null || now !== lastTickTime;
      lastTickTime = now;
      if (state === S.IDLE) {
        stuckTicks = 0;
        return;
      }
      if (advanced && !loadingOrBuffering) {
        // Healthy playback still reports, once per second. The dropped-frame
        // complaint only exists while the playhead IS advancing, so a
        // snapshot limited to stalls could never measure it; ev=tick is the
        // per-second row that carries fps / drop / res for a PLAYING stream.
        stuckTicks = 0;
        sendReceiverSnapshot('tick');
        return;
      }
      if (!advanced) stuckTicks++;
      sendReceiverSnapshot(loadingOrBuffering ? 'buffering' : 'stuck');

      // Self-rescue, reported before it acts so the sender log shows both
      // the state that triggered it and the seek it performed. Three
      // seconds of a playhead that has not moved is the 15:10 failure
      // (one frame decoded, position reported as -58 ms, playbackRate 0, no
      // further segment fetches ever), and the playhead was INSIDE the
      // buffered range the whole time, so a gap jump was never going to
      // help and neither is a test for one.
      if (stuckTicks < 3) return;
      // Three seconds of a motionless playhead is NOT on its own a reason to
      // move it. On 2026-09-12 at 16:30 it was the reason the receiver threw
      // the picture away: Shaka's live seek range had collapsed to one
      // segment minus the presentation delay (seek=[51.368-52.373], see
      // AVAILABILITY_WINDOW_SECONDS), the playhead sat a few milliseconds
      // below its start in permanent BUFFERING, and this watchdog then
      // seeked BACKWARD out of the buffer entirely (err=nudge 45.411 ->
      // 39.185), which is the handful of frames Logan saw. Three rules now
      // bound it:
      //
      //  1. Never within one target duration of the seek range end. That is
      //     where a live playhead belongs; waiting there for the next
      //     segment is normal and a seek cannot make the segment arrive.
      //  2. Only act when the playhead is BEHIND the buffered media (it will
      //     never be reached by playback) or when the element has nothing
      //     decodable at the playhead (readyState < 2) while media IS
      //     buffered ahead of it.
      //  3. Never act while a seek is already outstanding, and never more
      //     often than WATCHDOG_MIN_INTERVAL_MS. The 17:13 session nudged
      //     every 4 s for 97 s and flushed the decoder on every one of them.
      stuckTicks = 0;
      if (seekPending) return;
      const nowMs = Date.now();
      if (nowMs - lastWatchdogAt < WATCHDOG_MIN_INTERVAL_MS) return;
      const ranges = bufferedRanges();
      if (!ranges.length) return;
      const head = ranges[0][0];
      const tail = ranges[ranges.length - 1][1];
      const range = seekRange();
      if (range && range[1] !== null &&
          video.currentTime >= range[1] - TARGET_DURATION_SECONDS) {
        // At the live edge by design.
        return;
      }
      const behindBuffer = video.currentTime < head;
      const starvedWithMediaAhead = video.readyState < 2 && tail > video.currentTime + 0.1;
      if (!behindBuffer && !starvedWithMediaAhead) return;
      lastWatchdogAt = nowMs;
      resyncPlayhead('nudge');
    }, 1000);

    // Put the media element where Shaka believes the playhead is.
    //
    // Measured off-device in a real Chromium MediaSource, 'segments'
    // AppendMode and timestampOffset 0 (what manifest.hls.sequenceMode=false
    // produces), replaying the receiver's own order: append the init
    // segment, seek, then append seg0 / seg1 / seg2.
    //
    //   requested 0.000 -> playhead 0.000, played from buffered start 0.0667
    //   requested 1.940 -> playhead 0.000, played from buffered start 0.0667
    //   requested 5.000 -> playhead 0.000, played from buffered start 0.0667
    //
    // A seek issued while nothing is buffered is discarded, and the element
    // then starts at the head of the buffer no matter what was asked for.
    // That is exactly what the receiver did on 2026-09-12 at 15:10: Shaka
    // seeked to 2.439 (window end 11.311 minus the presentation delay) at
    // 15:10:03.851 and again at 15:10:04.086, seg0 was not appended until
    // 15:10:04.106, and the playhead came out at 0.016, the media's own
    // first sample. The same three segments with the seek issued AFTER the
    // appends land the playhead exactly where it was asked for, every time.
    //
    // So the element plays from the head of the buffer while Shaka's
    // presentation position stays a whole presentation delay ahead of it.
    // Shaka then reports a position before the start of its own live window
    // (-58 ms), holds the rate at 0 waiting for media at a playhead that
    // does not exist, and asks StreamingEngine for nothing: the sender's
    // proxy log goes quiet after seg2 with playlist polls continuing
    // forever. This function closes that gap with a seek issued when media
    // does exist, which is the one kind the element honours.
    function resyncPlayhead(ev) {
      const video = mediaElement();
      if (!video) return;
      const ranges = bufferedRanges();
      if (!ranges.length) return;
      const range = seekRange();

      // Seek INTO media that exists. The 17:13 session failed because the
      // target came from the seek range alone: the playhead was behind the
      // buffered start (175.58 with buffered=[176.21-188.03]) and every
      // rescue aimed at a point the element had nothing decodable for, so it
      // stalled again immediately and the watchdog repeated it.
      //
      // Pick the buffered range that actually overlaps the live seek range;
      // media outside the seek window is media Shaka will not stream on from.
      // If nothing is buffered inside the seek range there is no seek worth
      // issuing and we leave the playhead alone: the next append, not a
      // decoder flush, is what fixes that case.
      let buf = null;
      if (range && range[0] !== null && range[1] !== null) {
        for (const r of ranges) {
          if (r[1] > range[0] && r[0] < range[1]) {
            // Prefer the latest overlapping range (closest to the edge).
            buf = r;
          }
        }
        if (!buf) return;
      } else {
        buf = ranges[ranges.length - 1];
      }
      const bufStart = buf[0];
      const bufEnd = buf[1];
      if (bufEnd - bufStart <= RESYNC_START_MARGIN_SECONDS + RESYNC_END_MARGIN_SECONDS) {
        // Too little media to aim inside; wait for the next append.
        return;
      }

      // Aim LIVE_START_BEHIND_SECONDS behind the live edge, but never past
      // the media we have, and never at the very front of it.
      let target = range && range[1] !== null ?
        range[1] - LIVE_START_BEHIND_SECONDS : bufEnd - RESYNC_END_MARGIN_SECONDS;
      target = Math.min(target, bufEnd - RESYNC_END_MARGIN_SECONDS);
      target = Math.max(target, bufStart + RESYNC_START_MARGIN_SECONDS);

      const now = roundTo(video.currentTime, 3);
      // Nothing to do if we are already there. This replaces the old
      // forward-only rule: a playhead BEHIND the buffered start has to move
      // forward anyway, and a playhead ahead of the buffer (the other way the
      // element ends up outside its own media) has to move back to reach it,
      // so direction is no longer the test. Distance is.
      if (Math.abs(target - video.currentTime) < RESYNC_START_MARGIN_SECONDS) {
        maybeResumePlayback(ev + '-atTarget');
        return;
      }
      lastReceiverError = ev + ' ' + now + ' -> ' + roundTo(target, 3);
      sendReceiverSnapshot(ev);
      // Through the CAF API, not video.currentTime. Writing currentTime
      // behind CAF's back leaves its state machine describing a player that
      // is not the one on screen (the 17:13 session reported PAUSED with
      // rate 1 for 97 s while this page seeked the element directly), and
      // CAF then has no reason to resume or to refresh the media status.
      let seeked = false;
      try {
        if (playerManager.seek) {
          playerManager.seek(target);
          seeked = true;
        }
      } catch (e) {
        seeked = false;
      }
      if (!seeked) {
        try {
          video.currentTime = target;
        } catch (e) {
          // Nothing more to try from here; the snapshot above says so.
        }
      }
      maybeResumePlayback(ev);
    }

    // Resume a pause nobody asked for.
    //
    // A seek issued while CAF is BUFFERING with autoplay can leave the
    // element paused, and CAF reports PAUSED from then on: no further media
    // is decoded however many times the playhead is moved, which is the 97 s
    // "state=PAUSED rate=1" arc. A user pause is tracked separately (the
    // PAUSE / PLAY interceptors below) so this never fights the remote.
    function maybeResumePlayback(ev) {
      const video = mediaElement();
      if (!video) return;
      if (userPaused) return;
      if (!video.paused) return;
      lastReceiverError = ev + ' autoresume';
      try {
        playerManager.play();
      } catch (e) {
        // Fall back to the element; CAF will pick the state up from it.
        try {
          const r = video.play();
          // play() rejects when the element is not allowed to start; record
          // it rather than letting it surface as an unhandled rejection.
          if (r && r.catch) {
            r.catch((err) => {
              lastReceiverError = ev + ' play() rejected ' +
                (err && err.name ? err.name : 'error');
              sendReceiverSnapshot('playreject');
            });
          }
        } catch (e2) {
          // Nothing more to try.
        }
      }
      sendReceiverSnapshot('resume');
    }

    // Shaka configuration for the phone-local HLS proxy.
    //
    // sequenceMode: Shaka's manifest.hls.sequenceMode defaults to TRUE,
    // which puts our single muxed (video+audio) SourceBuffer into MSE
    // 'sequence' AppendMode. Chromium logs the warning on EVERY load
    // (Google TV Streamer, 2026-09-12 14:22:20.237 and 14:23:27.619):
    //
    //   using MSE 'sequence' AppendMode for a SourceBuffer with multiple
    //   tracks may cause loss of track synchronization. In some cases,
    //   buffered range gaps and playback stalls can occur. It is
    //   recommended to instead use 'segments' mode for a multitrack
    //   SourceBuffer.
    //
    // It is not advice to ignore. In sequence mode Chromium re-anchors the
    // whole append on the presentation timestamp of the first coded frame
    // it processes and re-times the other track against it: the same load
    // shows the audio track's bytestream timestamps (22666 us and up) and
    // the timestamps the audio decoder is handed (5666 us) differing by a
    // constant offset. The receiver rendered exactly one frame, advanced
    // 114 ms, and then reported BUFFERING at position 48 ms for the next
    // 35 s with 12.5 s appended and nothing left to decode at the
    // playhead. Because playback never advanced, Shaka's buffering goal
    // stayed satisfied, so it refreshed live.m3u8 on cadence and never
    // fetched another segment (seg0, seg1, seg2, then playlist polls
    // only). In 'segments' mode each track is placed at its own honest
    // timestamps and a hole is an honest hole the gap jumper can cross.
    //
    // defaultPresentationDelay: start LIVE_START_BEHIND_SECONDS behind the
    // edge rather than at it. Starting at the edge is what made the
    // receiver run the buffer dry and re-sync forward over a segment
    // (2026-09-12 review), and a skipped segment is the other way into a
    // stalled renderer.
    //
    // gapDetectionThreshold: jump holes as small as 0.1 s. Our worst case
    // is a sub-frame seam at a segment boundary, far under Shaka's older
    // 0.5 s default, which would leave the renderer parked at it.
    //
    // Built with `new cast.framework.PlaybackConfig()` and handed to
    // context.start() below. getPlaybackConfig() returns null before the
    // context is started (CAF only materializes the active config at
    // start/load time), so reading it here and assigning shakaConfig onto
    // it threw a TypeError at parse-and-run time, start() was never
    // reached, and the receiver never entered RUNNING.
    let playbackConfig = null;
    try {
      playbackConfig = new cast.framework.PlaybackConfig();
    } catch (e) {
      console.warn('AerioTV: PlaybackConfig unavailable, using CAF defaults', e);
    }
    if (playbackConfig) {
      playbackConfig.shakaConfig = {
        manifest: {
          hls: { sequenceMode: false },
          defaultPresentationDelay: LIVE_START_BEHIND_SECONDS,
          availabilityWindowOverride: AVAILABILITY_WINDOW_SECONDS,
        },
        streaming: {
          gapDetectionThreshold: 0.1,
          // Nudge the playhead if it ever does stop advancing, instead of
          // sitting on one frame forever (these are Shaka's defaults, set
          // explicitly because the CAF-bundled version is not pinned).
          stallEnabled: true,
          stallThreshold: 1,
          stallSkip: 0.1,
        },
      };
      // Progress for the loading status line. Both handlers are documented as
      // pass-through transforms (CastReceiverOptions.playbackConfig), so they
      // return their input untouched; the only thing this page does is count.
      // A throw in either one would fail the fetch, hence the try/catch.
      playbackConfig.manifestHandler = (manifest) => {
        try {
          if (!manifestSeenAt) manifestSeenAt = Date.now();
        } catch (e) {
          // Diagnostics must never be able to break playback.
        }
        return manifest;
      };
      playbackConfig.segmentHandler = (segment) => {
        try {
          if (segment && typeof segment.byteLength === 'number') {
            bytesAppended += segment.byteLength;
          } else if (segment && segment.data &&
                     typeof segment.data.byteLength === 'number') {
            bytesAppended += segment.data.byteLength;
          }
          // A segment came back, so the manifest certainly did too.
          if (!manifestSeenAt) manifestSeenAt = Date.now();
        } catch (e) {
          // Counting is cosmetic; never let it break a segment.
        }
        return segment;
      };
    }

    // Unload the <video> element. Cast tears the page down while the media
    // pipeline is still running: on 2026-09-12 the receiver got
    // CastV2.Receiver.Stop.In and the web contents were destroyed under a
    // playing pipeline, and the audio sink outlived the video surface by
    // the teardown interval (audible audio after the X on the sender's
    // card). Pausing and detaching the source first ends the pipeline
    // before the page goes away.
    function unloadMediaElement() {
      const video = document.querySelector('video.castMediaElement');
      if (!video) return;
      try {
        video.pause();
        video.removeAttribute('src');
        // load() is what actually releases the MediaSource; without it the
        // element keeps the old blob and its pipeline alive.
        video.load();
      } catch (e) {
        // Teardown is best-effort: the element may already be gone.
      }
    }

    // A media STOP is the normal end of a cast (the sender sends one
    // before ending the session). Let CAF run its own stop first, then
    // unload on the next task so the element is not left holding a
    // MediaSource.
    // Registration is optional polish: if this CAF build does not expose the
    // STOP message type, log and carry on rather than letting a throw here
    // stop the script before context.start().
    //
    // The deferred unload is GATED on the load generation. Senders send a STOP
    // before starting something else, and this callback runs a task later: on
    // a stop-then-load (a channel flip that goes through STOP) the old code
    // paused and detached the element AFTER the new load had already created
    // its MediaSource, leaving a paused element under a CAF that thought it
    // was playing. That is the shape of the 2026-09-12 17:13 session, which
    // sat at state=PAUSED rate=1 for 97 s while the watchdog seeked it.
    try {
      playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.STOP,
        (request) => {
          const generation = loadGeneration;
          setTimeout(() => {
            if (generation !== loadGeneration) return;
            unloadMediaElement();
          }, 0);
          return request;
        });
    } catch (e) {
      console.warn('AerioTV: STOP interceptor not registered', e);
    }

    // Track who asked for a pause, so maybeResumePlayback only ever undoes a
    // pause that nobody asked for. Interceptors, not events: the event says
    // the element paused, the interceptor says a PAUSE message arrived.
    try {
      playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.PAUSE,
        (request) => {
          userPaused = true;
          sendReceiverSnapshot('pause-msg');
          return request;
        });
      playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.PLAY,
        (request) => {
          userPaused = false;
          sendReceiverSnapshot('play-msg');
          return request;
        });
    } catch (e) {
      console.warn('AerioTV: PAUSE/PLAY interceptors not registered', e);
    }

    // Normalize each LOAD. Keep the sender's streamType (VOD casting later);
    // for LIVE, duration -1 is the documented contract ("the player instances
    // are responsible for calculating it when the content is LIVE") and it
    // keeps sender mini-controllers from binding to a growing finite duration.
    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      (loadRequestData) => {
        // A new load supersedes any pending teardown (see the STOP
        // interceptor) and clears the pause intent of the previous media.
        loadGeneration++;
        userPaused = false;
        seekPending = false;
        // Fresh tune: spinner up, counters zeroed, no status text yet.
        loadingSince = Date.now();
        manifestSeenAt = 0;
        bytesAppended = 0;
        renderingSince = 0;
        bufferingSince = 0;
        lastRenderTime = null;
        // Frame counters belong to the previous media; a delta across a tune
        // would read as a huge fps spike.
        lastQualityAt = 0;
        lastTotalFrames = null;
        lastDroppedFrames = null;
        rafHz = null;
        // One 1 s rAF measurement per load, reported as ev=raf.
        measureRefreshRate();
        showLoading();
        const media = loadRequestData.media;
        if (media) {
          media.contentType = media.contentType || 'video/mp4';
          if (media.streamType === cast.framework.messages.StreamType.LIVE) {
            media.duration = -1;
          }
        }
        return loadRequestData;
      });

    // Once per successful load (NOT on buffering recoveries, which are common
    // on live IPTV): hide the idle screen and flash the channel banner.
    playerManager.addEventListener(
      cast.framework.events.EventType.PLAYER_LOAD_COMPLETE,
      () => {
        // The idle art stays up until the picture is actually rendering (the
        // loading ticker hides it). LOAD_COMPLETE only means CAF accepted the
        // media: on a live tune the first frame is seconds away, and hiding
        // the art here left a black screen with no sign of progress.
        const info = playerManager.getMediaInformation();
        // Live: drop SEEK (and queue skipping) from the advertised commands.
        // Google TV's system cast panel pins a timeline overlay permanently
        // when a live stream advertises SEEK: the sliding HLS window grows on
        // every playlist refresh, each media status update re-wakes the
        // panel, and it never times out (device-observed on a Google TV
        // Streamer; the position marker freezes while the bar grows). The
        // proxy's ~25 s window is not worth seeking anyway. Done AFTER load
        // completes: mutating supported commands mid-load killed the session
        // when tried live.
        if (info && info.streamType === cast.framework.messages.StreamType.LIVE) {
          const C = cast.framework.messages.Command;
          playerManager.removeSupportedMediaCommands(
            C.SEEK | C.QUEUE_NEXT | C.QUEUE_PREV, true);
        }
        const md = info && info.metadata;
        flashBanner(md && md.title, md && md.subtitle);
        // Media exists by now, so a seek here is honoured where the one
        // Shaka issued before the first append was not. See resyncPlayhead.
        sendReceiverSnapshot('loaded');
        setTimeout(() => resyncPlayhead('resync'), 0);
      });

    // Playback truly over: back to the launch screen. MEDIA_FINISHED ALSO fires
    // with endedReason INTERRUPTED on every new LOAD (a channel flip replacing
    // the playing media) -- returning to idle on that would paint the "Ready to
    // cast" splash over the whole multi-second IPTV tune (review 2026-07-15).
    // Only a real stop / end-of-stream / error goes back to idle.
    playerManager.addEventListener(
      cast.framework.events.EventType.MEDIA_FINISHED,
      (event) => {
        if (event && event.endedReason ===
            cast.framework.events.EndedReason.INTERRUPTED) return;
        hideLoading();
        idle.classList.remove('hidden');
        banner.classList.remove('visible');
        renderingSince = 0;
        bufferingSince = 0;
      });

    // Surface a failed load: without this a flip whose new stream errors would
    // leave the previous idle/banner state stale. Return to a clean idle screen.
    playerManager.addEventListener(
      cast.framework.events.EventType.ERROR,
      (event) => {
        hideLoading();
        idle.classList.remove('hidden');
        banner.classList.remove('visible');
        renderingSince = 0;
        bufferingSince = 0;
        lastReceiverError = describeError(event);
        sendReceiverSnapshot('error');
      });

    // ---- telemetry hooks ----
    //
    // One snapshot per player state change plus the load and seek
    // transitions, so the sender log carries the whole arc of a load
    // (LOADING, BUFFERING, PLAYING, and any stall) with the buffered ranges
    // and the seek range attached to each step.
    function describeError(event) {
      if (!event) return 'error';
      const parts = [];
      if (event.detailedErrorCode !== undefined &&
          event.detailedErrorCode !== null) {
        parts.push('code=' + event.detailedErrorCode);
      }
      if (event.reason) parts.push('reason=' + event.reason);
      if (event.error && event.error.message) {
        parts.push(String(event.error.message));
      }
      return parts.length ? parts.join(' ') : 'error';
    }

    const TELEMETRY_EVENTS = [
      ['PLAYER_STATE_CHANGED', 'state'],
      ['PLAYER_LOAD_COMPLETE', 'loaded'],
      ['PLAYER_LOADING', 'loading'],
      ['BUFFERING', 'buffering-event'],
      ['SEEKED', 'seeked'],
      ['SEEKING', 'seeking'],
      ['STALLED', 'stalled'],
      ['MEDIA_FINISHED', 'finished'],
    ];
    for (const [name, label] of TELEMETRY_EVENTS) {
      const type = cast.framework.events.EventType[name];
      // CAF does not expose every one of these in every bundle version;
      // skipping an absent type is better than a throw that would stop the
      // script before context.start().
      if (!type) continue;
      try {
        playerManager.addEventListener(type, () => {
          // A seek is outstanding between SEEKING and SEEKED; the watchdog
          // must not stack another one on top of it.
          if (label === 'seeking') seekPending = true;
          if (label === 'seeked') seekPending = false;
          sendReceiverSnapshot(label);
        });
      } catch (e) {
        console.warn('AerioTV: telemetry listener not registered for ' + name, e);
      }
    }

    const receiverOptions = {
      // Required when not using <cast-media-player>, so smart displays don't
      // paint their own default controls/scrim over this page.
      uiConfig: { touchScreenOptimizedApp: true },
      // The phone-local HLS proxy (casting rework P1) serves live HLS with
      // fMP4/CMAF segments. The legacy MPL player CAF picks for HLS by
      // default fails it with PLAYBACK/104 even though the same fetches and
      // MSE appends succeed from this page (device-verified via DevTools on
      // a Google TV Streamer); Shaka plays it. Progressive/DASH loads are
      // unaffected by this flag.
      useShakaForHls: true,
      // Declare the diagnostic channel so CAF will carry our snapshots.
      // Without the declaration the platform drops the message and logs
      // "Not supported namespace" (observed for the senders' existing
      // urn:x-cast:com.aeriotv.control probe, which this page does not
      // implement and which is handled by the Android TV receiver instead).
      customNamespaces: Object.assign(
        {}, { [DEBUG_NAMESPACE]: cast.framework.system.MessageType.JSON }),
    };
    // Shaka tuning above. CastReceiverOptions.playbackConfig is the
    // documented place to supply it; the player manager has no config to read
    // from until the context is started, so it is set here and not via
    // setPlaybackConfig/getPlaybackConfig.
    if (playbackConfig) receiverOptions.playbackConfig = playbackConfig;

    context.start(receiverOptions);

    // touchScreenOptimizedApp makes CAF inject a fullscreen <touch-controls>
    // element into this page. On touch devices (smart displays) it is the
    // only way to pause, so it stays. On remote-driven TVs it renders the
    // permanent bottom-third title/timeline panel that never auto-hides
    // (device-observed on a Google TV Streamer: pinned across hours of live
    // playback; hiding the element live made it vanish instantly with
    // playback unaffected). Capabilities are readable once the system is
    // ready.
    // Last chance before the page dies: stop the player and unload the
    // element. SHUTDOWN fires on the app being stopped (the X on the
    // sender's card, the Stop button on the TV) and is the case where the
    // pipeline was still playing.
    try {
      context.addEventListener(cast.framework.system.EventType.SHUTDOWN, () => {
        try { playerManager.stop(); } catch (e) { /* already stopped */ }
        unloadMediaElement();
      });
    } catch (e) {
      console.warn('AerioTV: SHUTDOWN listener not registered', e);
    }

    context.addEventListener(cast.framework.system.EventType.READY, () => {
      sendCapabilities('ready');
      const caps = context.getDeviceCapabilities();
      if (!caps || !caps[cast.framework.system.DeviceCapabilities.TOUCH_INPUT_SUPPORTED]) {
        const st = document.createElement('style');
        st.textContent = 'touch-controls { display: none !important; }';
        document.head.appendChild(st);
      }
    });
  </script>
</body>
</html>
